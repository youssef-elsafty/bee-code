# ==============================================================================
# Egyptian Programming Academy Platform - Production Nginx Configuration
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # --------------------------------------------------------------------------
    # Basic Settings & MIME Types
    # --------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version display in headers

    # --------------------------------------------------------------------------
    # Max Body Size
    # --------------------------------------------------------------------------
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # Rate Limiting Definitions
    # --------------------------------------------------------------------------
    # Rate limit zone for user registration endpoint: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_register_limit:10m rate=5r/m;

    # General API rate limit zone: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

    # Return HTTP 429 (Too Many Requests) when rate limit is exceeded
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Upstream Services
    # --------------------------------------------------------------------------
    upstream backend_app {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80)
    # Serves traffic, handles Certbot verification, & redirects to HTTPS when active
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name egyptianacademy.org www.egyptianacademy.org localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Let's Encrypt / Certbot ACME Challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # OPTIONAL: HTTP to HTTPS Redirect (Uncomment once SSL certs are generated)
        # ----------------------------------------------------------------------
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # ----------------------------------------------------------------------
        # Static Files Proxy (Django collectstatic output)
        # ----------------------------------------------------------------------
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Media Files Proxy (User uploads, avatars, course materials)
        # ----------------------------------------------------------------------
        location /media/ {
            alias /var/www/media/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Registration Endpoint with strict Rate Limiting
        # ----------------------------------------------------------------------
        location /api/v1/register/ {
            limit_req zone=api_register_limit burst=3 nodelay;

            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # General API Endpoints Proxy -> Django Backend
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Django Administration Interface
        # ----------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # WebSockets Proxy (Django Channels / Live Code Runner Notifications)
        # ----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s; # 24h keep-alive for persistent WS channels
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # Progressive Web App (PWA) Service Worker & Manifest Headers
        # ----------------------------------------------------------------------
        location ~* ^/(sw\.js|firebase-messaging-sw\.js|manifest\.json)$ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # ----------------------------------------------------------------------
        # Frontend Next.js Application Proxy
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

